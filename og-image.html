<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG Image — Roast Generator 9000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #6D28D9 0%, #EC4899 50%, #FBBF24 100%);
    position: relative;
    overflow: hidden;
    color: #2A0F4F;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.6; }
  .b1 { width: 380px; height: 380px; background: #FBBF24; top: -90px; left: -90px; }
  .b2 { width: 360px; height: 360px; background: #6D28D9; bottom: -80px; right: -60px; }
  .b3 { width: 280px; height: 280px; background: #EC4899; top: 280px; left: 740px; }

  .card {
    position: absolute;
    inset: 50px;
    background: #FFFFFF;
    border-radius: 32px;
    padding: 56px 64px;
    box-shadow: 0 30px 60px -10px rgba(42,15,79,0.4);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top { display: flex; flex-direction: column; gap: 18px; }
  .eyebrow {
    align-self: flex-start;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #6D28D9;
    background: rgba(109,40,217,0.10);
    padding: 8px 18px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  h1 {
    font-weight: 700;
    font-size: 96px;
    line-height: 0.95;
    margin: 0;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #6D28D9, #EC4899 55%, #FBBF24);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    font-size: 32px;
    font-weight: 600;
    color: #5A4675;
    margin: 0;
    line-height: 1.2;
  }
  .roast {
    background: #FFF7E6;
    border-radius: 20px;
    padding: 24px 32px;
    box-shadow: 0 0 0 4px #FFE9B0 inset;
    font-size: 30px;
    color: #2A0F4F;
    font-weight: 600;
    line-height: 1.25;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 22px;
    font-weight: 700;
    color: #6D28D9;
    letter-spacing: 0.06em;
  }
  .flame {
    position: absolute;
    right: 90px;
    top: 80px;
    font-size: 90px;
    transform: rotate(12deg);
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="card">
    <div class="top">
      <span class="eyebrow">🌶️ Live</span>
      <h1>ROAST<br>GENERATOR 9000</h1>
      <p class="subtitle">Type a name. Get absolutely cooked. (Lovingly.)</p>
    </div>
    <div class="roast">"Jordan has 47 tabs open. WHY."</div>
    <div class="footer">
      <span>shannon1980.github.io/roast-generator-9000</span>
      <span>🎲 76 ROASTS</span>
    </div>
    <div class="flame">🔥</div>
  </div>
</body>
</html>
