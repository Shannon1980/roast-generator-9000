<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  html { min-height: 100%; }

  body {
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 600;
    color: #2A0F4F;
    min-height: 100vh;
    background: linear-gradient(135deg, #6D28D9, #EC4899, #FBBF24, #EC4899, #6D28D9);
    background-size: 400% 400%;
    background-attachment: fixed;
    animation: bgShift 18s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .blob.b1 { width: 520px; height: 520px; background: #FBBF24; top: -160px; left: -160px; animation: float1 14s ease-in-out infinite; }
  .blob.b2 { width: 460px; height: 460px; background: #EC4899; bottom: -140px; right: -140px; animation: float2 16s ease-in-out infinite; }
  .blob.b3 { width: 380px; height: 380px; background: #6D28D9; top: 40%; left: 60%; animation: float3 20s ease-in-out infinite; }
  @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,40px) scale(1.1); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,-30px) scale(1.08); } }
  @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-80px,40px) scale(0.95); } }

  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  .card {
    position: relative;
    z-index: 2;
    width: min(880px, 100%);
    background: #FFFFFF;
    border-radius: 24px;
    padding: 56px 56px 48px;
    box-shadow:
      0 30px 80px -20px rgba(109, 40, 217, 0.55),
      0 18px 40px -10px rgba(236, 72, 153, 0.45),
      0 0 0 1px rgba(255,255,255,0.6) inset;
    text-align: center;
    animation: cardIn 0.7s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes cardIn {
    from { transform: translateY(20px) scale(0.96); opacity: 0; }
    to   { transform: translateY(0)    scale(1);    opacity: 1; }
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: #6D28D9;
    background: linear-gradient(135deg, rgba(109,40,217,0.10), rgba(236,72,153,0.10));
    padding: 8px 16px;
    border-radius: 999px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .eyebrow .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #EC4899;
    box-shadow: 0 0 0 4px rgba(236,72,153,0.18);
    animation: pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.25); }
  }

  h1 {
    font-weight: 700;
    font-size: 56px;
    line-height: 1.0;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #6D28D9, #EC4899 55%, #FBBF24);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: titleWobble 6s ease-in-out infinite;
  }
  @keyframes titleWobble {
    0%,100% { transform: rotate(-0.4deg); }
    50%     { transform: rotate(0.4deg); }
  }

  .subtitle {
    font-size: 20px;
    font-weight: 600;
    color: #5A4675;
    margin: 0 0 36px;
  }

  .field {
    text-align: left;
    margin-bottom: 24px;
  }
  .field label {
    display: block;
    font-size: 16px;
    font-weight: 600;
    color: #6D28D9;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin: 0 0 10px 4px;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap .emoji {
    position: absolute;
    left: 22px; top: 50%;
    transform: translateY(-50%);
    font-size: 28px;
    pointer-events: none;
    opacity: 0.85;
  }
  input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-weight: 600;
    font-size: 24px;
    color: #2A0F4F;
    background: #F8F5FF;
    border: 3px solid #E9DEFF;
    border-radius: 18px;
    padding: 18px 22px 18px 64px;
    outline: none;
    transition: border-color .2s, background .2s, box-shadow .2s, transform .2s;
  }
  input[type="text"]::placeholder { color: #8E76B0; font-weight: 600; }
  input[type="text"]:focus {
    border-color: #EC4899;
    background: #FFFFFF;
    box-shadow: 0 0 0 6px rgba(236,72,153,0.18);
  }
  input[type="text"].shake { animation: shake 0.45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-8px); }
    40%     { transform: translateX(8px); }
    60%     { transform: translateX(-6px); }
    80%     { transform: translateX(6px); }
  }

  .btn-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    font-weight: 700;
    border-radius: 18px;
    transition: transform .18s cubic-bezier(.2,.9,.3,1.4), box-shadow .18s, filter .18s;
    will-change: transform;
  }
  button:active { transform: translateY(1px) scale(0.99); }
  button:focus-visible {
    outline: 3px solid #FBBF24;
    outline-offset: 3px;
  }

  .btn-primary {
    font-size: 28px;
    color: #fff;
    background: linear-gradient(135deg, #6D28D9 0%, #EC4899 100%);
    padding: 20px 36px;
    box-shadow:
      0 14px 30px -8px rgba(236,72,153,0.55),
      0 6px 14px -4px rgba(109,40,217,0.45),
      0 0 0 1px rgba(255,255,255,0.18) inset;
    letter-spacing: 0.04em;
  }
  .btn-primary:hover {
    transform: translateY(-3px) scale(1.03);
    animation: pulse 1.1s ease-in-out infinite;
    filter: brightness(1.05);
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 14px 30px -8px rgba(236,72,153,0.55), 0 6px 14px -4px rgba(109,40,217,0.45), 0 0 0 1px rgba(255,255,255,0.18) inset, 0 0 0 0 rgba(236,72,153,0.55); }
    50%     { box-shadow: 0 18px 36px -8px rgba(236,72,153,0.65), 0 8px 18px -4px rgba(109,40,217,0.55), 0 0 0 1px rgba(255,255,255,0.18) inset, 0 0 0 14px rgba(236,72,153,0.0); }
  }

  .btn-secondary {
    font-size: 22px;
    color: #6D28D9;
    background: #F4ECFF;
    padding: 18px 28px;
    box-shadow: 0 4px 0 #E0CFFA, 0 8px 18px -8px rgba(109,40,217,0.35);
  }
  .btn-secondary:hover {
    transform: translateY(-2px);
    background: #EFE3FF;
    box-shadow: 0 6px 0 #E0CFFA, 0 10px 22px -8px rgba(109,40,217,0.45);
  }

  .roast-stage {
    margin-top: 32px;
    min-height: 0;
  }
  .roast-box {
    background: #FFF7E6;
    color: #2A0F4F;
    border-radius: 22px;
    padding: 36px 36px 32px;
    font-size: 32px;
    line-height: 1.3;
    font-weight: 600;
    text-wrap: pretty;
    position: relative;
    box-shadow:
      0 12px 30px -10px rgba(109,40,217,0.25),
      0 0 0 3px #FFE9B0 inset;
    transform-origin: center;
  }
  .roast-box.in {
    animation: roastIn 0.55s cubic-bezier(.2,.9,.3,1.4);
  }
  @keyframes roastIn {
    0%   { transform: scale(0.7) rotate(-3deg); opacity: 0; }
    60%  { transform: scale(1.05) rotate(1.5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .roast-box .corner {
    position: absolute;
    font-size: 40px;
    line-height: 1;
    transform: rotate(-12deg);
  }
  .roast-box .corner.tl { top: -18px; left: -10px; transform: rotate(-18deg); }
  .roast-box .corner.br { bottom: -18px; right: -10px; transform: rotate(14deg); }

  .roast-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 20px;
    font-size: 16px;
    color: #5A4675;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .roast-meta .pill {
    background: #F4ECFF;
    color: #6D28D9;
    padding: 8px 14px;
    border-radius: 999px;
  }

  .empty-state {
    background: #FAFAFE;
    border: 3px dashed #E9DEFF;
    border-radius: 22px;
    padding: 36px 24px;
    color: #6B5685;
    font-size: 22px;
    font-weight: 600;
  }
  .empty-state .big { font-size: 44px; display: block; margin-bottom: 8px; }

  .footer-note {
    margin-top: 28px;
    font-size: 14px;
    color: #5A4675;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .footer-note a {
    color: #6D28D9;
    text-decoration: none;
    border-bottom: 2px dotted #E0CFFA;
  }
  .footer-note a:hover { border-bottom-color: #EC4899; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: #2A0F4F;
    color: #FFF;
    padding: 14px 22px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.06em;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 10;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 640px) {
    body { padding: 16px; }
    .card { padding: 32px 22px; }
    h1 { font-size: 40px; }
    .btn-primary { font-size: 22px; padding: 16px 22px; }
    .btn-secondary { font-size: 18px; padding: 14px 18px; }
    .roast-box { font-size: 24px; padding: 24px; }
    input[type="text"] { font-size: 20px; padding: 16px 16px 16px 56px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001s !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<canvas id="confetti"></canvas>

<main class="card" role="main">
  <span class="eyebrow"><span class="dot"></span>Live</span>
  <h1>ROAST GENERATOR 9000</h1>
  <p class="subtitle">Type a name. Get absolutely cooked. (Lovingly.)</p>

  <div class="field">
    <label for="nameInput">Name to roast</label>
    <div class="input-wrap">
      <span class="emoji" aria-hidden="true">🔥</span>
      <input id="nameInput" type="text" placeholder="e.g. Jordan" autocomplete="off" maxlength="40" />
    </div>
  </div>

  <div class="btn-row">
    <button id="roastBtn" class="btn-primary">🔥 ROAST ME</button>
    <button id="againBtn" class="btn-secondary" style="display:none;">🎲 ROAST AGAIN</button>
    <button id="shareBtn" class="btn-secondary" style="display:none;">📋 SHARE</button>
  </div>

  <div class="roast-stage" id="roastStage">
    <div class="empty-state" id="emptyState">
      <span class="big">🌶️</span>
      Pop your name in and brace yourself.
    </div>
  </div>

  <div class="footer-note">
    Classroom Friendly · Volume 9000 ·
    <a href="mailto:shannon@govorentoe.com?subject=Roast%20Generator%209000%20feedback">Feedback</a> ·
    <a href="https://github.com/Shannon1980/roast-generator-9000" target="_blank" rel="noopener">GitHub</a>
  </div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const ROASTS = [
    "{name}, your Roblox skin hasn't changed since 2022. We KNOW.",
    "{name} eats cereal for dinner and we both know it.",
    "{name}'s water bottle has been 'lost' for 3 weeks. It's in their backpack.",
    "{name} types like they're being timed. They're not.",
    "{name} has 47 tabs open. WHY.",
    "{name} laughs at their own jokes BEFORE the punchline.",
    "{name}'s favorite food is technically a snack.",
    "{name} has watched the same YouTube video 200 times this month.",
    "{name} corrects people about Pokémon. Constantly.",
    "{name} thinks the cafeteria pizza is 'actually fine.' Bestie.",
    "{name} has a sock under their bed older than their sibling.",
    "{name}'s playlist has the same 4 songs on repeat. Forever.",
    "{name} owns a 'lucky' pencil. They've owned it for one (1) test.",
    "{name} pretends to read the menu but always orders chicken nuggets.",
    "{name}'s 'I'm not tired' face is exactly their tired face.",
    "{name} has a stuffed animal hierarchy and we should all respect it.",
    "{name} got REAL competitive about who can hold their breath the longest.",
    "{name}'s handwriting is a vibe. The vibe is 'doctor at 3am.'",
    "{name} talks to dogs in a higher voice than babies.",
    "{name} insists they 'don't get cold' while wearing 4 layers.",
    "{name} would lose to a goldfish in a focus contest.",
    "{name} treats Capri Suns like a competitive sport.",
    "{name} has a snack stash. We all know about the snack stash.",
    "{name} rates every movie 'pretty good' even when it's terrible.",
    "{name} has tried to befriend exactly one bug. It did not go well.",
    "{name} has a 'lucky' eraser. It has erased nothing.",
    "{name} insists they 'don't have a favorite' but the answer is dinosaurs.",
    "{name}'s lunchbox has crumbs from last week. Possibly older.",
    "{name} brings a sweater EVERYWHERE. Even in July.",
    "{name} thinks they're fast. They are medium.",
    "{name} has a notebook covered in stickers and zero notes.",
    "{name}'s favorite color changes every Tuesday.",
    "{name} can recite every Pokémon type but not the multiplication tables.",
    "{name} has a pencil case organized by ZERO logic.",
    "{name} brings up Minecraft in conversations about the weather.",
    "{name} once held in a sneeze for 20 seconds and is still proud.",
    "{name} has a stuffed animal they pretend they don't sleep with anymore.",
    "{name} would WIN at staring contests if blinking weren't a thing.",
    "{name}'s socks never match. They claim it's a choice.",
    "{name} has a 'best friend' rotation and we're all on the schedule.",
    "{name} pretends not to hear their parents and we KNOW the volume on those headphones.",
    "{name} thinks they invented the joke. They did not.",
    "{name} has a 'forever pencil' they refuse to sharpen.",
    "{name} eats popcorn one piece at a time. WHY.",
    "{name} has tried to do a cartwheel for 4 years running.",
    "{name} loses at Uno and pretends they 'let you win.'",
    "{name} owns three flashlights. None work.",
    "{name} insists they're 'almost done' with their book. They started in October.",
    "{name} has a snack hierarchy and Goldfish are #1, sorry not sorry.",
    "{name} got really into a hobby for 9 days. It's over now.",
    "{name} has a 'good seat' on the bus and will fight for it.",
    "{name} thinks they're funnier in group projects than they are.",
    "{name}'s shoes squeak in a specific way that everyone knows by now.",
    "{name} has a 'system' for stickers. The system is hoarding.",
    "{name} drinks chocolate milk like it's a sport.",
    "{name} has the same 4 dance moves at every single party.",
    "{name} pretends to read the back of cereal boxes. They're just stalling.",
    "{name} owns a watch that doesn't tell time. It's 'for the look.'",
    "{name} has a hat that survived ONE pool day. RIP.",
    "{name} has a backpack that's definitely heavier than they are.",
    "{name} insists they 'studied.' We saw the YouTube tab open.",
    "{name} once won a participation ribbon and brought it up in February.",
    "{name} has a 'best handwriting' that only appears on the first 3 lines.",
    "{name} can fold a paper airplane that immediately nosedives. Every time.",
    "{name} has a stuffed animal collection with strict bedtime rules.",
    "{name} brings up their dog in conversations about math homework.",
    "{name} has a 'comfort hoodie' that hasn't seen a washer this season.",
    "{name} can name all the colors of Skittles but skips green.",
    "{name} owns 7 water bottles. Uses one. Loses three. Don't ask about the rest.",
    "{name} thinks they're a fast reader. They're skipping pages, we see you.",
    "{name} has a sock with a hole. They're keeping it 'just in case.'",
    "{name} has tried bubble gum tricks and bit their lip every time.",
    "{name} keeps a snack in their desk and still acts surprised about it.",
    "{name}'s 'short story' is 19 minutes long and we're at minute 7.",
    "{name} would rather rewatch a series finale than learn something new.",
    "{name} talks to plants. The plants are doing... fine. Probably."
  ];

  // Lightweight name filter — strips anything that isn't a letter/space/hyphen/apostrophe.
  // Catches the obvious low-effort mischief in a classroom; not a security boundary.
  const BLOCKED = /\b(f+u+c+k+|s+h+i+t+|b+i+t+c+h+|a+s+s+h+o+l+e+|d+a+m+n+|c+r+a+p+)\w*/i;

  const $name   = document.getElementById('nameInput');
  const $roast  = document.getElementById('roastBtn');
  const $again  = document.getElementById('againBtn');
  const $share  = document.getElementById('shareBtn');
  const $stage  = document.getElementById('roastStage');
  const $empty  = document.getElementById('emptyState');
  const $toast  = document.getElementById('toast');

  let deck = [];
  let lastIndex = -1;
  let lastRoast = null;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function refillDeck() {
    deck = shuffle(ROASTS.map((_, i) => i));
    if (deck[0] === lastIndex && deck.length > 1) {
      [deck[0], deck[1]] = [deck[1], deck[0]];
    }
  }

  function pickRoastIndex() {
    if (!deck.length) refillDeck();
    const idx = deck.shift();
    lastIndex = idx;
    return idx;
  }

  function sanitizeName(raw) {
    let s = (raw || '').trim();
    s = s.replace(/[^\p{L}\s'\-]/gu, '');
    s = s.replace(/\s+/g, ' ').trim();
    if (!s) return '';
    if (BLOCKED.test(s)) return 'Mystery Friend';
    return s.split(' ').map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : w).join(' ');
  }

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function renderRoast(name) {
    const idx = pickRoastIndex();
    const text = ROASTS[idx].replaceAll('{name}', name);
    lastRoast = text;
    const safeText = escapeHTML(text);
    const safeName = escapeHTML(name);

    $stage.innerHTML = `
      <div class="roast-box in" role="status" aria-live="polite">
        <span class="corner tl" aria-hidden="true">🔥</span>
        ${safeText}
        <span class="corner br" aria-hidden="true">💀</span>
        <div class="roast-meta">
          <span class="pill">Roast #${String(idx + 1).padStart(2,'0')} / ${ROASTS.length}</span>
          <span>Target: ${safeName}</span>
        </div>
      </div>
    `;
    fireConfetti();
  }

  function bump(el) {
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    el.focus();
  }

  function showToast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => $toast.classList.remove('show'), 1800);
  }

  function shareRoast() {
    if (!lastRoast) return;
    const name = sanitizeName($name.value);
    const url = new URL(window.location.href);
    url.search = name ? '?name=' + encodeURIComponent(name) : '';
    const shareText = lastRoast + '\n\n— Roast Generator 9000\n' + url.toString();

    if (navigator.share) {
      navigator.share({
        title: 'Roast Generator 9000',
        text: lastRoast + '\n— Roast Generator 9000',
        url: url.toString()
      }).catch(() => {/* user dismissed */});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(shareText)
        .then(() => showToast('📋 Copied to clipboard!'))
        .catch(() => showToast('Could not copy — try selecting text'));
    } else {
      showToast('Sharing not supported on this browser');
    }
  }

  $roast.addEventListener('click', () => {
    const name = sanitizeName($name.value);
    if (!name) { bump($name); return; }
    if ($empty && $empty.parentNode) $empty.remove();
    $again.style.display = 'inline-block';
    $share.style.display = 'inline-block';
    renderRoast(name);
  });

  $again.addEventListener('click', () => {
    const name = sanitizeName($name.value);
    if (!name) { bump($name); return; }
    renderRoast(name);
  });

  $share.addEventListener('click', shareRoast);

  $name.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      $roast.click();
    }
  });

  // Permalink: ?name=Jordan pre-fills, ?name=Jordan&go=1 auto-roasts
  const params = new URLSearchParams(window.location.search);
  const seedName = params.get('name');
  if (seedName) {
    $name.value = seedName.slice(0, 40);
    if (params.get('go') === '1') {
      window.requestAnimationFrame(() => $roast.click());
    }
  }

  // Confetti — burst on each roast, loop pauses when idle
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let W = 0, H = 0;
  const pieces = [];
  let looping = false;

  function resize() {
    dpr = Math.max(1, window.devicePixelRatio || 1);
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = ['#6D28D9', '#EC4899', '#FBBF24', '#22D3EE', '#34D399', '#F97316', '#FFFFFF'];

  function fireConfetti() {
    const cx = W / 2;
    const cy = Math.min(H / 2 - 40, 240);
    for (let i = 0; i < 30; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 6 + Math.random() * 9;
      pieces.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        size: 8 + Math.random() * 10,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.4,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        shape: Math.random() < 0.5 ? 'rect' : 'circ',
        life: 0,
        maxLife: 110 + Math.random() * 40
      });
    }
    if (!looping) {
      looping = true;
      requestAnimationFrame(tick);
    }
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.vy += 0.28;
      p.vx *= 0.995;
      p.vy *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life++;

      const alpha = Math.max(0, 1 - p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size / 1.6);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      if (p.life >= p.maxLife || p.y > H + 60) {
        pieces.splice(i, 1);
      }
    }
    if (pieces.length > 0) {
      requestAnimationFrame(tick);
    } else {
      looping = false;
    }
  }

  window.addEventListener('load', () => {
    if (!seedName) $name.focus();
  });
})();
</script>

</body>
</html>
