    "{name} starts a 'fan club' of themselves. Brave.",
    "{name} pretends to text their parents at a restaurant. Nobody is there to text.",
    "{name} pretends to call their parents at a sleepover. Their phone is dead.",
    "{name} pretends to be on the phone in line to skip small talk.",
    "{name} pretends to type to look busy at school. The screen is off.",
    "{name} pretends to read at family events. The book is upside down.",
    "{name} pretends to drink water to dodge a question.",
    "{name} pretends to chew slowly to dodge a question.",
    "{name} pretends not to be home when their friend's parents call.",
    "{name} pretends not to know their younger sibling at the playground.",
    "{name} pretends not to be related at a fancy event.",
    "{name} pretends the embarrassing photo is 'not them.' It is them.",
    "{name} pretends to forget every song lyric they know all of.",
    "{name} pretends to forget every meme they invented.",
    "{name} insists they 'started' a meme. Citation needed.",
    "{name} insists they 'had that idea first.' Citation needed.",
    "{name} insists they 'called it.' They did not call it.",
    "{name} insists they 'predicted that.' Years after the fact.",
    "{name} insists they 'had a feeling.' Always.",
    "{name} insists they 'knew it.' Always after.",
    "{name} insists they 'told everyone.' They told no one.",
    "{name} insists 'I told you' with great confidence.",
    "{name} insists 'I tried' while standing still.",
    "{name} insists 'I tried' with their phone in their hand the whole time.",
    "{name} insists 'I helped' by watching from a chair.",
    "{name} insists 'I helped' by giving advice they didn't follow.",
    "{name} insists 'I'm helping' by adding ice to a juice nobody asked for.",
    "{name} insists 'I'll help' and starts a different chore.",
    "{name} insists 'I'll help' and disappears into a bathroom for an hour.",
    "{name} insists 'I'll help' and starts a snack break first.",
    "{name} insists 'I'll help' and ends up the supervisor.",
    "{name}'s 'last roast' is never the last roast. Run it again.",

    // — 2026 POP CULTURE & CURRENT TRENDS —
    "{name} lost 500 aura points walking into the wrong classroom.",
    "{name} thinks they're a sigma male but cried when their Roblox pet disappeared.",
    "{name} says 'that's so Ohio' about everything. Including actual Ohio.",
    "{name} watched one Skibidi Toilet video and now it's their whole personality.",
    "{name}'s brain rot is so advanced they can't have a conversation without saying 'gyatt.'",
    "{name} thinks having a Stanley cup makes them an influencer. It's a water bottle, {name}.",
    "{name} has more Stanley cups than actual cups in their kitchen.",
    "{name} owns 47 Squishmallows and can tell you each one's name, birthday, and backstory.",
    "{name} sleeps with so many Squishmallows there's no room for {name}.",
    "{name} treats their Squishmallow collection like a real estate portfolio.",
    "{name} thinks they'd survive Five Nights at Freddy's. They scream at a toaster.",
    "{name} watches FNAF lore videos at 2am and then sleeps with the lights on.",
    "{name} has a MrBeast video for every life situation. 'But in THIS video...'",
    "{name} thinks they could win a MrBeast challenge. They can't even win at Uno.",
    "{name} would sell their sibling for a spot in a MrBeast video.",
    "{name}'s entire vocabulary is just MrBeast thumbnails. 'I SPENT 24 HOURS IN MY ROOM!' Yeah, that's called Saturday.",
    "{name} plays Gorilla Tag and has broken exactly one TV and two lamps.",
    "{name} lost their VR controller mid-game and punched the wall. Again.",
    "{name} plays Doors on Roblox and screams at every single door. That's... the whole game.",
    "{name} has spent more Robux than a small country's GDP.",
    "{name} asks for Robux like it's a human right.",
    "{name} traded their best Roblox item for one that's worth 3 coins. Business genius.",
    "{name} has a Blox Fruits level higher than their math grade.",
    "{name} says 'W' and 'L' in real conversations like they're grading people's lives.",
    "{name} rates everything in aura points. 'That sneeze? Minus 50 aura.'",
    "{name} thinks they gained aura by walking slow in the hallway. Nobody noticed, {name}.",
    "{name} calls everything 'sigma.' The sandwich is not sigma, {name}.",
    "{name} does the sigma face in every photo. It just looks like they smelled something bad.",
    "{name} watched one Andrew Tate clip and now walks differently. Sit down, {name}.",
    "{name} says 'rizz' but has never successfully talked to their crush without freezing.",
    "{name} thinks they have rizz because they made eye contact once.",
    "{name} calls their teacher 'the NPC' and wonders why they get extra homework.",
    "{name} calls everyone an NPC but follows the exact same routine every single day.",
    "{name} treats the school hallway like they're the main character in an anime. Nobody else sees the sparkles.",
    "{name} watches Wednesday on Netflix once and now walks with no facial expressions.",
    "{name} did the Wednesday dance at a school event. Nobody joined in.",
    "{name} has a Lethal Company scream that can be heard from three houses away.",
    "{name} plays Lethal Company and runs directly into every monster like they're magnetized.",
    "{name} has an iPad kid energy that no amount of grass-touching will fix.",
    "{name} says 'touch grass' to people but hasn't been outside since last Tuesday.",
    "{name} calls things 'bussin' that are absolutely not bussin. Like their homework.",
    "{name} says 'no cap' and then immediately caps.",
    "{name} makes friendship bracelets like they're running a factory. Taylor Swift would be concerned.",
    "{name} has more friendship bracelets than actual friendships.",
    "{name} spent $200 on Eras Tour bracelets and went to zero concerts.",
    "{name}'s entire room is decorated in Taylor Swift posters but they claim they're 'not THAT obsessed.'",
    "{name} plays Fortnite collabs just for the skins and has never won a match.",
    "{name} has a Fortnite locker worth more than their college fund.",
    "{name} thinks being good at Subway Surfers makes them an athlete.",
    "{name} plays Subway Surfers during class and thinks nobody can see the phone. We ALL see it."
  ];

  // Lightweight name filter — strips anything that isn't a letter/space/hyphen/apostrophe.
  // Catches the obvious low-effort mischief in a classroom; not a security boundary.
  const BLOCKED = /\b(f+u+c+k+|s+h+i+t+|b+i+t+c+h+|a+s+s+h+o+l+e+|d+a+m+n+|c+r+a+p+)\w*/i;

  // {s} is the regular-verb suffix: "s" for he/she, "" for they.
  const PRONOUNS = {
    he: {
      they: 'he',  them: 'him', their: 'his',  theirs: 'his',   themself: 'himself',
      theyre: "he's", theyve: "he's", theyll: "he'll", theyd: "he'd",
      are: 'is', arent: "isn't", were: 'was', werent: "wasn't",
      have: 'has', havent: "hasn't", do: 'does', dont: "doesn't",
      s: 's'
    },
    she: {
      they: 'she', them: 'her', their: 'her',  theirs: 'hers',  themself: 'herself',
      theyre: "she's", theyve: "she's", theyll: "she'll", theyd: "she'd",
      are: 'is', arent: "isn't", were: 'was', werent: "wasn't",
      have: 'has', havent: "hasn't", do: 'does', dont: "doesn't",
      s: 's'
    },
    they: {
      they: 'they', them: 'them', their: 'their', theirs: 'theirs', themself: 'themselves',
      theyre: "they're", theyve: "they've", theyll: "they'll", theyd: "they'd",
      are: 'are', arent: "aren't", were: 'were', werent: "weren't",
      have: 'have', havent: "haven't", do: 'do', dont: "don't",
      s: ''
    }
  };

  function applyPronouns(text, key) {
    const map = PRONOUNS[key] || PRONOUNS.they;
    return text.replace(/\{([A-Za-z]+)\}/g, (m, token) => {
      if (token === 'name') return m;
      const lower = token.toLowerCase();
      const val = map[lower];
      if (val === undefined) return m;
      const first = token.charAt(0);
      if (first === first.toUpperCase() && first !== first.toLowerCase()) {
        return val.charAt(0).toUpperCase() + val.slice(1);
      }
      return val;
    });
  }

  const $name   = document.getElementById('nameInput');
  const $roast  = document.getElementById('roastBtn');
  const $again  = document.getElementById('againBtn');
  const $share  = document.getElementById('shareBtn');
  const $stage  = document.getElementById('roastStage');
  const $empty  = document.getElementById('emptyState');
  const $toast  = document.getElementById('toast');
  const $pronounBtns = document.querySelectorAll('.pronoun-btn');

  let selectedPronoun = 'they';

  function setPronoun(key) {
    if (!PRONOUNS[key]) return;
    selectedPronoun = key;
    $pronounBtns.forEach(b => {
      const active = b.dataset.pronoun === key;
      b.classList.toggle('active', active);
      b.setAttribute('aria-checked', String(active));
    });
  }

  $pronounBtns.forEach(b => {
    b.addEventListener('click', () => setPronoun(b.dataset.pronoun));
  });

  let deck = [];
  let seen = new Set();
  let lastIndex = -1;
  let lastRoast = null;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function refillDeck(isReset) {
    seen.clear();
    deck = shuffle(ROASTS.map((_, i) => i));
    if (deck[0] === lastIndex && deck.length > 1) {
      [deck[0], deck[1]] = [deck[1], deck[0]];
    }
    if (isReset) showToast('🔄 All ' + ROASTS.length + ' roasts seen! Reshuffling…');
  }

  function pickRoastIndex() {
    if (!deck.length) refillDeck(true);
    const idx = deck.shift();
    seen.add(idx);
    lastIndex = idx;
    return idx;
  }

  function sanitizeName(raw) {
    let s = (raw || '').trim();
    s = s.replace(/[^\p{L}\s'\-]/gu, '');
    s = s.replace(/\s+/g, ' ').trim();
    if (!s) return '';
    if (BLOCKED.test(s)) return 'Mystery Friend';
    return s.split(' ').map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : w).join(' ');
  }

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function renderRoast(name) {
    const idx = pickRoastIndex();
    const text = applyPronouns(ROASTS[idx], selectedPronoun).replaceAll('{name}', name);
    lastRoast = text;
    const safeText = escapeHTML(text);
    const safeName = escapeHTML(name);

    $stage.innerHTML = `
      <div class="roast-box in" role="status" aria-live="polite">
        <span class="corner tl" aria-hidden="true">🔥</span>
        ${safeText}
        <span class="corner br" aria-hidden="true">💀</span>
        <div class="roast-meta">
          <span>Target: ${safeName}</span>
        </div>
      </div>
    `;
    fireConfetti();
  }

  function bump(el) {
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    el.focus();
  }

  function showToast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => $toast.classList.remove('show'), 1800);
  }

  function shareRoast() {
    if (!lastRoast) return;
    const name = sanitizeName($name.value);
    const url = new URL(window.location.href);
    const params = new URLSearchParams();
    if (name) params.set('name', name);
    if (selectedPronoun !== 'they') params.set('pronouns', selectedPronoun);
    url.search = params.toString() ? '?' + params.toString() : '';
    const shareText = lastRoast + '\n\n— Roast Generator 9000\n' + url.toString();

    if (navigator.share) {
      navigator.share({
        title: 'Roast Generator 9000',
        text: lastRoast + '\n— Roast Generator 9000',
        url: url.toString()
      }).catch(() => {/* user dismissed */});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(shareText)
        .then(() => showToast('📋 Copied to clipboard!'))
        .catch(() => showToast('Could not copy — try selecting text'));
    } else {
      showToast('Sharing not supported on this browser');
    }
  }

  $roast.addEventListener('click', () => {
    const name = sanitizeName($name.value);
    if (!name) { bump($name); return; }
    if ($empty && $empty.parentNode) $empty.remove();
    $again.style.display = 'inline-block';
    $share.style.display = 'inline-block';
    renderRoast(name);
  });

  $again.addEventListener('click', () => {
    const name = sanitizeName($name.value);
    if (!name) { bump($name); return; }
    renderRoast(name);
  });

  $share.addEventListener('click', shareRoast);

  $name.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      $roast.click();
    }
  });

  // Permalink: ?name=Jordan pre-fills, ?pronouns=he|she|they sets pronouns,
  // ?name=Jordan&go=1 auto-roasts.
  const params = new URLSearchParams(window.location.search);
  const seedPronoun = params.get('pronouns');
  if (seedPronoun && PRONOUNS[seedPronoun]) setPronoun(seedPronoun);
  const seedName = params.get('name');
  if (seedName) {
    $name.value = seedName.slice(0, 40);
    if (params.get('go') === '1') {
      window.requestAnimationFrame(() => $roast.click());
    }
  }

  // Confetti — burst on each roast, loop pauses when idle
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let W = 0, H = 0;
  const pieces = [];
  let looping = false;

  function resize() {
    dpr = Math.max(1, window.devicePixelRatio || 1);
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = ['#6D28D9', '#EC4899', '#FBBF24', '#22D3EE', '#34D399', '#F97316', '#FFFFFF'];

  function fireConfetti() {
    const cx = W / 2;
    const cy = Math.min(H / 2 - 40, 240);
    for (let i = 0; i < 30; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 6 + Math.random() * 9;
      pieces.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        size: 8 + Math.random() * 10,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.4,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        shape: Math.random() < 0.5 ? 'rect' : 'circ',
        life: 0,
        maxLife: 110 + Math.random() * 40
      });
    }
    if (!looping) {
      looping = true;
      requestAnimationFrame(tick);
    }
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.vy += 0.28;
      p.vx *= 0.995;
      p.vy *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life++;

      const alpha = Math.max(0, 1 - p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size / 1.6);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      if (p.life >= p.maxLife || p.y > H + 60) {
        pieces.splice(i, 1);
      }
    }
    if (pieces.length > 0) {
      requestAnimationFrame(tick);
    } else {
      looping = false;
    }
  }

  window.addEventListener('load', () => {
    if (!seedName) $name.focus();
  });
})();
</script>
